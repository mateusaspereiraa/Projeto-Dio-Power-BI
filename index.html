<style>:root{--bg:#f2f5fb;--c:#fff;--t:#14202e;--m:#5a6a7c;--l:#d5dde8;--a:#2f7bff;--b:#16a37f}@media(prefers-color-scheme:dark){:root{--bg:#0d141d;--c:#16202c;--t:#e7eef7;--m:#93a3b6;--l:#263446;--a:#6aa4ff;--b:#4fd1a1}}

.pgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}.pgs button{border:1px solid var(--l);background:var(--c);border-radius:10px;padding:8px;cursor:pointer;color:var(--t);text-align:left;font:inherit}.pgs img{width:100%;border-radius:6px}
